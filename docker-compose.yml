version: '3.8'

# Development Docker Compose Configuration
# For production deployment, use: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# This will apply production overrides (no port exposure for DB/Redis, resource limits, health checks, etc.)

services:
  postgres:
    image: postgres:15-alpine
    container_name: affiliate-mng-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: affiliate_mng
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - affiliate-network

  redis:
    image: redis:7-alpine
    container_name: affiliate-mng-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - affiliate-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: affiliate-mng-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./sdk/dist:/app/sdk_files:ro  # Mount SDK files as read-only
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - affiliate-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: affiliate-mng-frontend
    # Production mode - no command override, no volume mounts
    # For development mode, uncomment command and volumes below:
    # command: npm run dev
    # volumes:
    #   - ./frontend:/app
    #   - /app/node_modules
    #   - /app/.next
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    environment:
      - API_URL=http://backend:8000  # Server-side (SSR) API URL - overrides .env.local
    depends_on:
      - backend
    networks:
      - affiliate-network

volumes:
  postgres_data:
  redis_data:

networks:
  affiliate-network:
    driver: bridge
